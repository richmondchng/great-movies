syntax = "proto3";

option java_multiple_files = true;
option java_package = "test.richmond.filemgt.grpc";

service FileService {
  rpc GetImages(GetImagesRequest)
      returns (GetImagesForOwnersResponse);
}

message GetImagesRequest {
  repeated ImageOwner owners = 1;
}

message ImageOwner {
  string owner_id = 1;
}

message GetImagesForOwnersResponse {
  repeated Image images = 1;
}

message Image {
  string owner_id = 1;
  string image_id = 3;
  string file_url = 4;
  ImageType image_type = 5;
}

enum ImageType {
  IMAGE_TYPE_UNSPECIFIED = 0;
  COVER = 1;
  GALLERY = 2;
}