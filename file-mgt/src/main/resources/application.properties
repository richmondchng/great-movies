server.port=8091
spring.application.name=file-mgt

spring.datasource.url=jdbc:postgresql://localhost:5440/filemgt_db
spring.datasource.username=myuser
spring.datasource.password=secret

# Let Flyway handle schema generation, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

app.files.download.host-name=http://localhost:8091
app.files.upload.white-listed=jpg,jpeg,png,gif
app.files.volume.root=./uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB